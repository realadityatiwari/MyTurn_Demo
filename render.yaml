# Render Blueprint for MyTurn: ONE Docker web service + ONE persistent disk.
# This is Render configuration only. fly.toml is the alternative Fly.io configuration and is not used on Render.
# Before the first sync: choose the service name/region/plan below, then enter the secret values when Render prompts
# (STAFF_*_PASSWORD_HASH, TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET). Never put secret values in this file.
services:
  - type: web
    name: myturn
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: 0.5c-512mb          # smallest paid plan that supports a persistent disk (Free services cannot use disks)
    region: singapore
    numInstances: 1           # SQLite + in-memory sessions/rate limits + SSE require exactly one instance
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"        # Render's default web-service port; the app binds the PORT it is given
      - key: DATABASE_PATH
        value: /data/myturn.db
      - key: SEED_MODE
        value: empty
      # Render fronts every web service with Cloudflare, which supplies the single-IP CF-Connecting-IP header.
      # Do NOT reuse Fly's fly-client-ip here, and do not use X-Forwarded-For's last hop on Render.
      - key: TRUST_PROXY_HEADER
        value: cf-connecting-ip
      - key: TELEGRAM_MODE
        value: webhook         # remove this line for a website-only deployment (also leave the token/secret unset)
      # The public onrender.com origin is derived automatically. If you attach a custom domain, replace this
      # with the exact https://<custom-domain> origin (no path, no trailing slash).
      - key: PUBLIC_ORIGIN
        fromService:
          name: myturn
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: STAFF_ADMIN_PASSWORD_HASH
        sync: false            # prompted in the Render Dashboard; generated by node server/hash-password.js
      - key: STAFF_OPERATOR_PASSWORD_HASH
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
    disk:
      name: myturn-data
      mountPath: /data
      sizeGB: 1                # can be increased later; Render cannot shrink a disk
